name: lifelog
description: "LifeLog — سیستم عامل جامع مدیریت زندگی، کارها، عادات، خواب، تمرکز و ژورنال شخصی برای یاسین"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.2
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
