name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build LifeLog Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        working-directory: ./flutter_lifelog
        run: flutter pub get

      - name: Analyze Project Code
        working-directory: ./flutter_lifelog
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: ./flutter_lifelog
        run: flutter test

      - name: Build Android Release APK
        working-directory: ./flutter_lifelog
        run: flutter build apk --release --split-per-abi=false

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Release-APK
          path: flutter_lifelog/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
